name: nexgen

# Infrastructure + the three services. The LLM is a hosted OpenAI-compatible API (Groq);
# embeddings come from Ollama running on the host (not containerised).
services:
  elasticsearch:          # log storage, searched by the Query service
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - nexgen-net

  qdrant:                 # vector store for the RAG service
    image: qdrant/qdrant:v1.9.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - nexgen-net

  redis:                  # Master session history (Master falls back to memory without it)
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexgen-net

  master:
    build:
      context: .
      dockerfile: master/Dockerfile
    env_file:
      - ./master/.env           # OPENAI_API_KEY etc.
    environment:
      - MOCK_SERVICES=false
      - QUERY_SERVICE_URL=http://query:8001
      - RAG_SERVICE_URL=http://rag:8002
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
    networks:
      - nexgen-net

  query:
    build:
      context: .
      dockerfile: query/Dockerfile
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=openai/gpt-oss-20b
    ports:
      - "8001:8001"
    depends_on:
      - elasticsearch
    networks:
      - nexgen-net

  rag:
    build:
      context: .
      dockerfile: rag/Dockerfile
    environment:
      - QDRANT_URL=http://qdrant:6333
      - LLAMACPP_EMBED_SERVER_URL=http://host.docker.internal:11434   # Ollama on the host
    ports:
      - "8002:8002"
    depends_on:
      - qdrant
    networks:
      - nexgen-net

networks:
  nexgen-net:
    driver: bridge

volumes:
  es_data:
  qdrant_data:
  redis_data:
