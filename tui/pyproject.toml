[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nexgen-tui"
version = "0.1.0"
description = "Operator TUI that drives Master, Query, and RAG together"
requires-python = ">=3.12"
dependencies = [
  "textual>=1.0",
  "httpx>=0.27",
  "nexgen-shared",
]

[project.scripts]
nexgen = "tui.__main__:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["tui*"]

[tool.uv.sources]
nexgen-shared = { path = "../nexgen_shared" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
